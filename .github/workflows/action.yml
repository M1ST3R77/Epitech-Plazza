name: "Compilation"

on:
  pull_request:
    types:
    - opened
    branches-ignore:
    - 'ga-ignore-**'
  push:
    branches-ignore:
    - 'ga-ignore-**'

env:
  EXECUTABLES: "plazza 2 5 2000"

jobs:
  check_program_compilation:
    name: "Check Program Compilation"
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: mkdir ./build/ && cd ./build/ && cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release && cmake --build .
      timeout-minutes: 2
    - name: Check if all files exist
      run: |
        for file in $(echo "$EXECUTABLES" | tr ',' ' '); do
          if test -f "$file"; then
            echo "File $file exists"
          else
            echo "File $file does not exist"
            exit 1
          fi
        done